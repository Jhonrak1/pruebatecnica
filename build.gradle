plugins {
	id 'java'
    id 'org.springframework.boot' version '3.2.0'
	id 'io.spring.dependency-management' version '1.1.4'
}
/*Updated plugin versions to ensure compatibility with Java 21*/

group = 'com.prueba'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'io.projectreactor:reactor-test'  /*I need this for testing reactive code*/
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
/*Deleted unnecessary implementation from spring context*/

tasks.named('test') {
	useJUnitPlatform()
}
